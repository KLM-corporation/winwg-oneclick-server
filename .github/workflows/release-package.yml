name: Release package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build ZIP package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare package folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = "winwg-oneclick-server-${{ github.ref_name }}"
          if ('${{ github.ref_type }}' -ne 'tag') {
            $packageName = "winwg-oneclick-server-manual"
          }

          New-Item -ItemType Directory -Path dist | Out-Null
          New-Item -ItemType Directory -Path "dist/$packageName" | Out-Null

          $excludeDirs = @('.git', '.github', 'dist')
          $excludePatterns = @('*.conf', '*.key', '*.psk', '.env', '*.pem', '*.p12', '*.log')

          Get-ChildItem -Path . -Force | Where-Object {
            $_.Name -notin $excludeDirs
          } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "dist/$packageName" -Recurse -Force
          }

          foreach ($pattern in $excludePatterns) {
            Get-ChildItem -Path "dist/$packageName" -Recurse -Force -Filter $pattern -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          Compress-Archive -Path "dist/$packageName/*" -DestinationPath "dist/$packageName.zip" -Force
          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_PATH=dist/$packageName.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_PATH }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
